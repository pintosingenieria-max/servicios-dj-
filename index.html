        /**
         * Genera un PDF de la ficha del evento

        function generarPDF(evento, elemento) {
            // Clonar la tarjeta para no afectar la visualización
            const clon = elemento.cloneNode(true);
            // Limpiar acciones y otros elementos no deseados
            const actions = clon.querySelector('.event-actions');
            if (actions) actions.remove();

            // Crear un contenedor para el PDF
            const contenedor = document.createElement('div');
            contenedor.className = 'ficha-pdf';
            contenedor.innerHTML = `
                <div class="ficha-header">
                    <h2>📋 Ficha de Evento</h2>
                    <span>${evento.eventStatus || 'Pendiente'}</span>
                </div>
                <div class="ficha-body">

                        <span class="value">${evento.clientName || 'No especificado'}</span>
                    </div>

                        <span class="label">Teléfono</span>
                        <span class="value">${evento.clientPhone || 'No especificado'}</span>
                    </div>
                    <div class="ficha-row">
                        <span class="label">Fecha</span>
                        <span class="value">${formatDate(evento.eventDate)} · ${evento.eventTime || '--:--'} hs.</span>
                    </div>
                    <div class="ficha-row">
                        <span class="label">Tipo</span>
                        <span class="value">${evento.eventType || 'No especificado'}</span>
                    </div>
                    <div class="ficha-row">
                        <span class="label">Paquete</span>
                        <span class="value">${evento.packageSelected || 'No especificado'}</span>
                    </div>
                    <div class="ficha-row">
                        <span class="label">Lugar</span>
                        <span class="value">${evento.eventLocation || 'No especificado'}</span>
                    </div>
                    <div class="ficha-row">
                        <span class="label">Total</span>
                        <span class="value">${Number(evento.totalCost).toLocaleString('es-PY')} Gs.</span>
                    </div>
                    <div class="ficha-row">
                        <span class="label">Seña</span>
                        <span class="value">${Number(evento.depositAmount).toLocaleString('es-PY')} Gs.</span>
                    </div>
                    <div class="ficha-row">
                        <span class="label">Saldo</span>
                        <span class="value">${(Number(evento.totalCost) - Number(evento.depositAmount)).toLocaleString('es-PY')} Gs.</span>
                    </div>
                    ${evento.eventNotes ? `
                    <div class="ficha-row" style="flex-direction:column; align-items:stretch; gap:4px; border-bottom: none; padding-top:8px;">
                        <span class="label">Observaciones</span>
                        <span class="value" style="text-align:left; font-style:italic; color:#444;">${evento.eventNotes}</span>
                    </div>` : ''}
                </div>
                <div class="ficha-footer">
                    <p>Generado desde <strong>DJ MICHAEL</strong> · ${new Date().toLocaleDateString('es-ES')}</p>
                </div>
            `;

            // Opciones para html2pdf
            const opt = {
                margin:        [0.5, 0.5, 0.5, 0.5],
                filename:      `Ficha_${evento.clientName || 'evento'}.pdf`,
                image:         { type: 'jpeg', quality: 0.98 },
                html2canvas:   { scale: 2, letterRendering: true, useCORS: true, logging: false },
                jsPDF:         { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            // Generar y descargar PDF
            html2pdf().set(opt).from(contenedor).save();
        }

        /**
         * Copia los datos del evento al portapapeles en formato texto
         */
        function copiarFicha(evento) {
            const texto = `
        📋 FICHA DE EVENTO - DJ MICHAEL
        ─────────────────────────────
        Cliente:      ${evento.clientName || 'No especificado'}
        Teléfono:     ${evento.clientPhone || 'No especificado'}
        Fecha:        ${formatDate(evento.eventDate)} · ${evento.eventTime || '--:--'} hs.
        Tipo:         ${evento.eventType || 'No especificado'}
        Paquete:      ${evento.packageSelected || 'No especificado'}
        Lugar:        ${evento.eventLocation || 'No especificado'}
        Total:        ${Number(evento.totalCost).toLocaleString('es-PY')} Gs.
        Seña:         ${Number(evento.depositAmount).toLocaleString('es-PY')} Gs.
        Saldo:        ${(Number(evento.totalCost) - Number(evento.depositAmount)).toLocaleString('es-PY')} Gs.
        ${evento.eventNotes ? `Observaciones: ${evento.eventNotes}` : ''}
        ─────────────────────────────
        Generado desde DJ MICHAEL - ${new Date().toLocaleDateString('es-ES')}
        `;

            navigator.clipboard.writeText(texto).then(() => {
                alert('✅ Ficha copiada al portapapeles');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = texto;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Ficha copiada al portapapeles');
            });
        }
